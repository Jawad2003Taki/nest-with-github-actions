name: Deployment
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v7
      - name: Installing dep
        run: npm ci
      - name: Run Tests
        run: npm test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v7
      - name: Installing dep
        run: npm ci
      - name: Build the project
        run: npm run build
      - name: Deploy to server
        run: echo "Deploying ...."
